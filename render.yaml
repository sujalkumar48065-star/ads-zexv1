services:
  - type: web
    name: ads-zexv1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python "ads by zexv1.py"
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SELF_PING_INTERVAL
        value: "600"
